<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国会議員データベース</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>国会議員データベース</h1>
  <p class="subtitle">衆議院・参議院議員の客観データを検索・閲覧できます</p>
</header>

<main>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="氏名・会派・選挙区で検索">
    <select id="house-filter">
      <option value="">院を選択(すべて)</option>
      <option value="衆議院">衆議院</option>
      <option value="参議院">参議院</option>
    </select>
  </div>

  <p id="result-count"></p>

  <div id="member-list" class="member-list"></div>
</main>

<footer>
  <p>掲載データは衆議院・参議院の公式サイトから収集しています(客観データのみ、評価・投稿機能はありません)。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
